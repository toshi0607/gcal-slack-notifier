name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
      - run: npm ci
      - run: npm run check
